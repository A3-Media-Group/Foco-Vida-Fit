<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>body{margin:0;}</style>
</helmet>
<header style="position:sticky; top:0; z-index:50; background:#FAFAF7; border-bottom:1px solid #E4E8E2;">
  <div style="max-width:1200px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px;">
    <a href="index.dc.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; flex-shrink:0;">
      <span style="width:38px; height:38px; border-radius:50%; background:#16A34A; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><polyline points="2,13 7,13 9,7 12,18 15,9 17,13 22,13" stroke="#FAFAF7" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
      </span>
      <span style="font-family:'Poppins',sans-serif; font-weight:800; font-size:19px; color:#14211A; letter-spacing:-0.01em; white-space:nowrap;">Foco Vida<span style="color:#16A34A;"> Fit</span></span>
    </a>
    <nav style="{{ navStyle }}">
      <a href="index.dc.html" style="font-family:'Work Sans',sans-serif; font-size:15px; font-weight:500; color:#14211A; text-decoration:none; padding:8px 0;" style-hover="color:#16A34A;">Home</a>
      <a href="blog.dc.html" style="font-family:'Work Sans',sans-serif; font-size:15px; font-weight:500; color:#14211A; text-decoration:none; padding:8px 0;" style-hover="color:#16A34A;">Blog</a>
      <a href="receitas.dc.html" style="font-family:'Work Sans',sans-serif; font-size:15px; font-weight:500; color:#14211A; text-decoration:none; padding:8px 0;" style-hover="color:#16A34A;">Receitas</a>
      <a href="sobre.dc.html" style="font-family:'Work Sans',sans-serif; font-size:15px; font-weight:500; color:#14211A; text-decoration:none; padding:8px 0;" style-hover="color:#16A34A;">Sobre</a>
      <a href="contato.dc.html" style="font-family:'Work Sans',sans-serif; font-size:15px; font-weight:500; color:#14211A; text-decoration:none; padding:8px 0;" style-hover="color:#16A34A;">Contato</a>
    </nav>
    <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
      <button onClick="{{ toggleSearch }}" aria-label="Buscar" style="width:38px;height:38px;border-radius:50%;border:1px solid #E4E8E2;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#14211A" stroke-width="2"></circle><line x1="21" y1="21" x2="16.5" y2="16.5" stroke="#14211A" stroke-width="2" stroke-linecap="round"></line></svg>
      </button>
      <button onClick="{{ toggleMenu }}" style="{{ menuBtnStyle }}">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><line x1="0" y1="1" x2="18" y2="1" stroke="#14211A" stroke-width="2"></line><line x1="0" y1="7" x2="18" y2="7" stroke="#14211A" stroke-width="2"></line><line x1="0" y1="13" x2="18" y2="13" stroke="#14211A" stroke-width="2"></line></svg>
      </button>
    </div>
  </div>
  <sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid #E4E8E2; padding:14px 24px;">
      <input placeholder="Buscar artigos, receitas..." style="width:100%; max-width:480px; padding:10px 14px; border-radius:999px; border:1px solid #E4E8E2; font-family:'Work Sans',sans-serif; font-size:14px; outline:none; display:block; margin:0 auto;" />
    </div>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isMobile: (typeof window !== 'undefined' && window.innerWidth < 860), menuOpen: false, searchOpen: false };
  componentDidMount() {
    this.onResize = () => this.setState({ isMobile: window.innerWidth < 860 });
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const { isMobile, menuOpen, searchOpen } = this.state;
    const navStyle = isMobile ? {
      display: menuOpen ? 'flex' : 'none', flexDirection: 'column', position: 'absolute',
      top: '65px', left: 0, right: 0, background: '#FAFAF7', borderBottom: '1px solid #E4E8E2',
      alignItems: 'flex-start', gap: '4px', padding: '12px 24px 18px', boxShadow: '0 10px 24px rgba(20,33,26,0.08)'
    } : { display: 'flex', flexDirection: 'row', alignItems: 'center', gap: '26px' };
    return {
      navStyle,
      menuBtnStyle: { display: isMobile ? 'flex' : 'none', width: '38px', height: '38px', borderRadius: '50%', border: '1px solid #E4E8E2', background: '#fff', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' },
      searchOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      toggleSearch: () => this.setState(s => ({ searchOpen: !s.searchOpen })),
    };
  }
}

</script>
</body>
</html>
