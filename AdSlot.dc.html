<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%; max-width:{{ maxWidth }}; margin:{{ margin }}; height:{{ height }}px; border:1.5px dashed #C9D4CC; border-radius:8px; background:#F1F5F0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;">
  <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; letter-spacing:0.03em; color:#8A9790; text-transform:uppercase;">Espaço para anúncio</span>
  <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#B4BEB6;">Google AdSense · {{ label }}</span>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;label&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;728×90&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;height&quot;: {&quot;editor&quot;: null, &quot;default&quot;: 90, &quot;tsType&quot;: &quot;number&quot;}, &quot;maxWidth&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;728px&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;margin&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;24px auto&quot;, &quot;tsType&quot;: &quot;string&quot;}}"></script>
</body>
</html>
