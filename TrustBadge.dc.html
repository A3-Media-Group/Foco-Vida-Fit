<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; align-items:flex-start; gap:12px; padding:16px 18px; background:#F1F5F0; border-radius:12px; border:1px solid #E1E9E2;">
  <div style="width:26px; height:26px; border-radius:50%; background:#16A34A; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12L10 18L20 6" stroke="#FAFAF7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </div>
  <div>
    <div style="font-family:'Work Sans',sans-serif; font-weight:600; font-size:13.5px; color:#14211A;">Conteúdo revisado com base em fontes oficiais</div>
    <div style="font-family:'Work Sans',sans-serif; font-size:12.5px; color:#5B6B60; margin-top:2px;">Atualizado em {{ date }} · Escrito e revisado pela {{ author }}</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;date&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;22 ago 2026&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;author&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;equipe Foco Vida Fit&quot;, &quot;tsType&quot;: &quot;string&quot;}}">class Component extends DCLogic {
  renderVals() {
    return {
      date: this.props.date ?? '22 ago 2026',
      author: this.props.author ?? 'equipe Foco Vida Fit',
    };
  }
}
</script>
</body>
</html>
